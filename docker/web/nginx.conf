server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
