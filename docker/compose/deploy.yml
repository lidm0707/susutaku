# One-compose deploy: postgres + backend + web (nginx), private network.
#
#   docker compose -f docker/compose/deploy.yml up --build -d
#
# Inference is remote (no Metal in containers): the backend's "local model"
# provider talks to SUSUTAKU_LOCAL_MODEL_URL — run the model server on the
# host (e.g. :8992) or point the env at any reachable model server.
# Only the web UI is published, loopback-only.
name: susutaku-deploy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: susutaku
      POSTGRES_PASSWORD: susutaku
      POSTGRES_DB: susutaku
    volumes:
      - deploy-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Vector store for Qdrant chat memory (plan 34). Internal only.
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - deploy-qdrant:/qdrant/storage
    restart: unless-stopped

  mock-model:
    build:
      context: ../..
      dockerfile: docker/mock/Dockerfile.mock-model
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.backend
      # Default stage is hub-runtime; we need the API server.
      target: backend-runtime
    environment:
      DATABASE_URL: postgres://susutaku:susutaku@postgres:5432/susutaku
      # Default: bundled mock model. For real inference run an MLX server on
      # the host (:8992) and set SUSUTAKU_LOCAL_MODEL_URL=http://host.docker.internal:8992.
      SUSUTAKU_LOCAL_MODEL_URL: ${SUSUTAKU_LOCAL_MODEL_URL:-http://mock-model:8992}
      # codex login writes auth.json here; keep it on a volume so the
      # ChatGPT login survives container restarts.
      CODEX_HOME: /data/codex-home
      # setting.json (zai keys, system prompt, client env) on a volume so
      # settings survive redeploys.
      SUSUTAKU_SETTINGS: /data/settings/setting.json
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chat_memory}
      # Unset by default: chat memory off (no embeddings endpoint is bundled;
      # mock-model serves chat only). Point at an OpenAI-compatible endpoint,
      # e.g. http://host.docker.internal:11434/v1/embeddings
      SUSUTAKU_EMBEDDINGS_URL: ${SUSUTAKU_EMBEDDINGS_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    ports:
      # OAuth loopback callback for `codex login`: the browser's redirect to
      # http://localhost:1455 must reach the CLI listener inside the container.
      - "127.0.0.1:1455:1455"
    volumes:
      - codex-home:/data/codex-home
      - settings:/data/settings
      # podman storage + sandbox image cache survive redeploys
      - podman-storage:/var/lib/containers/storage
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      # rootless podman storage (fuse-overlayfs) inside the container
      - /dev/fuse:/dev/fuse
    # Nested rootless podman needs writable /proc/sys + cgroups, which no
    # combination of sysctls/devices can give inside an unprivileged
    # container — privileged is the supported mode for podman-in-podman.
    privileged: true
    depends_on:
      - postgres
      - qdrant
      - mock-model
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: docker/web/Dockerfile.web
    ports:
      # Loopback-only UI; pg / backend publish nothing.
      - "127.0.0.1:3334:80"
    environment:
      BACKEND_URL: http://backend:8991
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  deploy-pgdata:
  deploy-qdrant:
  codex-home:
  settings:
  podman-storage:
