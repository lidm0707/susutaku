# Web chat -> inline qwen3.8 (MLX) backend.
#
# Metal reality check: MLX inference only works on Apple Silicon macOS with
# direct Metal access. Linux containers (even on a Mac) have no Metal, so:
#   - `web` runs in Docker (vite build + nginx, proxies /api -> host backend)
#   - `backend` must run on the HOST:  cargo run -p backend
# The `backend-container` service is behind the `container-backend`
# profile for Linux/GPU-passthrough setups only (no Metal -> /api/chat 500s).
#
#   cargo run -p backend          # host, loads models/ qwen3.8 4bit mlx
#   docker compose -f docker/compose/base.yml up web --build
#   # then open http://localhost:3334
name: susutaku

services:
  # Kanban + agent state store. Host port 5434: 5432/5433 are already taken by
  # other local postgres containers, so this never hits them.
  postgres:
    image: postgres:17-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: susutaku
      POSTGRES_PASSWORD: susutaku
      POSTGRES_DB: susutaku
    volumes:
      - susutaku-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Vector store for Qdrant chat memory (plan 34). Memory itself stays
  # disabled unless SUSUTAKU_EMBEDDINGS_URL is set (host ollama etc.).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - susutaku-qdrant:/qdrant/storage
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: docker/web/Dockerfile.web
    ports:
      - "3334:80"
    environment:
      BACKEND_URL: http://${BACKEND_HOST:-host.docker.internal}:8991
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: backend in a container (no Metal -> /api/chat will 500).
  backend-container:
    profiles: ["container-backend"]
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.backend
    volumes:
      - ../models:/app/models:ro
      - ../setting.json:/app/setting.json
    ports:
      - "8991:8991"
    environment:
      DATABASE_URL: postgres://susutaku:susutaku@postgres:5432/susutaku
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chat_memory}
      # Unset by default: chat memory off. Point at any OpenAI-compatible
      # embeddings endpoint, e.g. http://host.docker.internal:11434/v1/embeddings
      SUSUTAKU_EMBEDDINGS_URL: ${SUSUTAKU_EMBEDDINGS_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

volumes:
  susutaku-pgdata:
  susutaku-qdrant:
