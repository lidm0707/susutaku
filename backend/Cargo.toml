[package]
name = "backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
hostname = "0.4"
libc = "0.2"
proto-rs = { workspace = true }
susutaku-mlx = { workspace = true }
core-agent = { workspace = true }
ureq = { workspace = true }
codex-cli = { path = "../crates/agent_3th_cli/codex_cli" }
claude-cli = { path = "../crates/agent_3th_cli/claude_cli" }
zai-api = { path = "../crates/cloud_model_api/zai_api" }
ai-interface-layer = { path = "../crates/cloud_model_api/ai_interface_layer" }
kanban-rs = { workspace = true }
codex-usage-rs = { workspace = true }
manager-rs = { workspace = true }
piplines = { workspace = true }
work = { workspace = true }
prompt-sys = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
async-trait = "0.1"
mockall = "0.13"

[dev-dependencies]
chrono = "0.4"
