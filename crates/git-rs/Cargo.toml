[package]
name = "git-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `https` + `vendored-openssl`: libgit2 needs a TLS backend or every https
# clone/push fails with "there is no TLS stream available".
git2 = { version = "0.20", default-features = false, features = [
    "https",
    "vendored-openssl",
] }
