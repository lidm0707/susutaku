# One entry per page / feature state to paint.
# setup actions run in order after navigation: click, fill, press.
[[pages]]
name = "01-login"
path = "/"

[[pages]]
name = "02-task"
path = "/task"
auth = true

[[pages]]
name = "03-task-add-task-modal"
path = "/task"
auth = true
[[pages.setup]]
click = '.task-add button'
shot_after = false

[[pages]]
name = "04-chat-modal"
path = "/task"
auth = true
[[pages.setup]]
click = "button.chat-fab"
shot_after = false

[[pages]]
name = "05-machines-popover"
path = "/task"
auth = true
[[pages.setup]]
click = 'button[title="machines"]'
shot_after = false

[[pages]]
name = "06-activity-popover"
path = "/task"
auth = true
[[pages.setup]]
click = 'button[title="activity"]'
shot_after = false

[[pages]]
name = "07-pipelines"
path = "/pipelines"
auth = true

[[pages]]
name = "08-cronjobs"
path = "/cronjobs"
auth = true

[[pages]]
name = "09-agents"
path = "/agents"
auth = true

[[pages]]
name = "10-settings"
path = "/settings"
auth = true
