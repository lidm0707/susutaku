[workspace]
resolver = "3"
members = [
    "backend",
    "crates/core-agent",
    "crates/proto-rs",
    "crates/local_model",
    "crates/hf_loader",
    "crates/mlx-rs",
    "crates/gguf-rs",
    "crates/agent_3th_cli/codex_cli",
    "crates/agent_3th_cli/claude_cli",
    "crates/pdf-rs",
    "crates/kanban-rs",
    "crates/queue-rs",
    "crates/manager-rs",
    "crates/piplines",
    "crates/work",
    "crates/cloud_model_api/ai_interface_layer",
    "crates/cloud_model_api/zai_api",
    "crates/prompt-sys",
    "crates/design_render",
    "crates/prompt_bench",
    "crates/codex-usage-rs",
    "crates/git-rs",
    "crates/lsp-rs",
    "crates/latenspace",
    "crates/knowledge_graph",
    "crates/modelless",
    "crates/token_gate_adapter",
    "crates/wgpu-rs",
    "crates/research-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
hf_loader = { path = "crates/hf_loader" }
susutaku-mlx = { path = "crates/mlx-rs" }
gguf-rs = { path = "crates/gguf-rs" }
git-rs = { path = "crates/git-rs" }
lsp-rs = { path = "crates/lsp-rs" }
latenspace = { path = "crates/latenspace" }
knowledge-graph = { path = "crates/knowledge_graph" }
token-gate-adapter = { path = "crates/token_gate_adapter" }
pdf-rs = { path = "crates/pdf-rs" }
kanban-rs = { path = "crates/kanban-rs" }
codex-usage-rs = { path = "crates/codex-usage-rs" }
queue-rs = { path = "crates/queue-rs" }
manager-rs = { path = "crates/manager-rs" }
prompt-sys = { path = "crates/prompt-sys" }
piplines = { path = "crates/piplines" }
work = { path = "crates/work" }
core-agent = { path = "crates/core-agent" }
proto-rs = { path = "crates/proto-rs" }
local-model = { path = "crates/local_model" }
wgpu-rs = { path = "crates/wgpu-rs" }
research-rs = { path = "crates/research-rs" }
ureq = "2"
serde_json = "1"
pdf-extract = "0.7"
mlx-rs = { version = "0.25", features = ["safetensors"] }
tokenizers = "0.21"
katgpt-tokenizer = { git = "https://github.com/lidm0707/katgpt-rs", branch = "main" }
katgpt-speculative = { git = "https://github.com/lidm0707/katgpt-rs", branch = "main", default-features = false, features = [
    "bigram_markov",
] }
katgpt-core = { git = "https://github.com/lidm0707/katgpt-rs", branch = "main", default-features = false, features = [
    "usage_rate_eviction",
] }
serde = { version = "1", features = ["derive"] }
